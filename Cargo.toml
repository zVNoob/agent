[package]
name = "agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"   # edition 2024
license = "MIT"
readme = "README.md"
description = "A coding agent in your terminal: a TUI over any OpenAI-compatible endpoint, with a seccomp sandbox that asks before every file and every endpoint, and every layer above the API written in Lua."
keywords = ["agent", "llm", "sandbox", "seccomp", "tui", "lua"]
categories = ["command-line-utilities"]
# `cargo install` cannot install this and is not meant to: the Lua tree ships as
# loose files (the sandbox policy is meant to be readable), so `make install` is
# the packaging path. `exclude` keeps a published crate from carrying the tree it
# would not use anyway.
exclude = ["/lua", "/scripts", "/target"]

# The binaries. `agent` is the one you want; the rest are for narrower jobs and
# are each named in the README's Development section.
[[bin]]
name = "agent"
path = "src/main.rs"

[[bin]]
name = "agent_probe"
path = "src/bin/agent_probe.rs"

[[bin]]
name = "chat"
path = "src/bin/chat.rs"

[[bin]]
name = "grammar_probe"
path = "src/bin/grammar_probe.rs"

[[bin]]
name = "mcp_fake"
path = "src/bin/mcp_fake.rs"

[[bin]]
name = "sandbox"
path = "src/bin/sandbox.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
async-stream = "0.3"
libc = "0.2"
anyhow = "1"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }

# Display width, and the cluster boundaries it is measured over. A panel lays
# out terminal *cells*, and a `char` is not one: an emoji is one `char` and two
# cells, a base letter plus a combining accent is two `char`s and one cell. Both
# are already in the tree via ratatui; naming them makes the layout's own rule
# explicit instead of borrowing the renderer's.
unicode-width = "0.2"
unicode-segmentation = "1"

# Runtime grammar acquisition (see `src/grammars.rs`): the tree-sitter core is
# a cargo dep, but grammar *code* is never — it is fetched from the registry,
# compiled with the system C compiler, and dlopen'd at runtime.
tree-sitter = "0.26"
tree-sitter-language = "0.1"
tree-sitter-highlight = "0.26"
libloading = "0.8"
flate2 = "1"
tar = "0.4"

# Lua policy substrate (see `src/seccomp/mod.rs` module docs): the sandbox is
# exposed to Lua *only*; LuaJIT is embedded via mlua. `vendored` compiles
# LuaJIT from source (the C compiler and `make` grammar acquisition already
# require), so no system LuaJIT install is needed.
mlua = { version = "0.12", features = ["luajit", "vendored"] }
